# The tools this workspace is checked with, at fixed versions: `mise install` gives
# everyone, and CI, the same ones. qretools is QREtools' command-line tool: `qretools check .`.
[tools]
node = "26"
# allow_low_downloads: mise refuses an npm package less than 30 days old unless allowed;
# qretools is JHUCities' own. Remove it after 2026-11-20, when the package is old enough.
"npm:qretools" = { version = "2.0.0-alpha.2", allow_low_downloads = true }
