# The tools this workspace is checked with, pinned: `mise install` gives everyone, and any
# CI, the same. qretools is the QREtools CLI, from npm: `qretools check .`.
[tools]
node = "26"
# allow_low_downloads: mise refuses an npm package younger than 30 days unless approved;
# qretools is JHUCities' own. Remove it after 2026-11-18, when the package is older.
"npm:qretools" = { version = "2.0.0-alpha.1", allow_low_downloads = true }
